<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cài Đặt Game</title>
  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #121212;
      color: #fff;
      padding: 20px;
      margin: 0;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      background: rgba(18, 18, 18, 0.95);
      padding: 10px 0;
      border-bottom: 2px solid #333;
      z-index: 1000;
    }
    button.save-btn {
      background: #00f3ff;
      color: #000;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
    }
    button.save-btn:hover { background: #00e0eb; }
    
    button.reset-btn {
      background: #ff4757;
      color: #fff;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(255, 71, 87, 0.5);
      margin-right: 10px;
    }
    button.reset-btn:hover { background: #ff6b81; }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .card {
      background: #1e1e1e;
      border: 1px solid #333;
      padding: 15px;
      border-radius: 8px;
    }
    .card h3 {
      margin: 0 0 15px 0;
      color: #ffd700;
      border-bottom: 1px solid #444;
      padding-bottom: 5px;
    }
    .form-group {
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
    }
    label { font-size: 13px; color: #aaa; margin-bottom: 4px; }
    input[type="text"] {
      background: #2a2a2a;
      border: 1px solid #444;
      color: #fff;
      padding: 8px;
      border-radius: 4px;
      outline: none;
      font-size: 14px;
    }
    input[type="text"]:focus { border-color: #00f3ff; }

    /* --- Giao diện Toast --- */
    .toast {
      visibility: hidden;
      min-width: 250px;
      background-color: rgba(30, 30, 30, 0.95);
      color: #fff;
      text-align: center;
      border-radius: 8px;
      padding: 16px 24px;
      position: fixed;
      z-index: 10000;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%); /* Căn giữa hoàn toàn */
      font-size: 16px;
      border: 2px solid #00f3ff;
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.5);
      opacity: 0;
      transition: opacity 0.3s, visibility 0.3s;
    }
    .toast.show {
      visibility: visible;
      opacity: 1;
    }

    /* --- Giao diện Modal Confirm --- */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.7);
      z-index: 10001;
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: #1e1e1e;
      padding: 25px 30px;
      border-radius: 8px;
      border: 2px solid #ff4757;
      text-align: center;
      box-shadow: 0 0 20px rgba(255, 71, 87, 0.4);
      max-width: 400px;
    }
    .modal-content h3 { margin-top: 0; color: #ff4757; font-size: 20px; margin-bottom: 10px; }
    .modal-buttons { margin-top: 20px; display: flex; justify-content: center; gap: 15px; }
    .btn-cancel { background: #444; color: #fff; border: none; padding: 10px 20px; font-size: 14px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .btn-cancel:hover { background: #666; }
    .btn-confirm { background: #ff4757; color: #fff; border: none; padding: 10px 20px; font-size: 14px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .btn-confirm:hover { background: #ff6b81; }
  </style>
</head>
<body>

  <!-- Modal Xác nhận Reset -->
  <div id="confirmModal" class="modal-overlay">
    <div class="modal-content">
      <h3>⚠️ Xác nhận LÀM MỚI</h3>
      <p style="color: #ccc; font-size: 15px;">Bạn có chắc chắn muốn LÀM MỚI TOÀN BỘ điểm số cuộc đua không?</p>
      <div class="modal-buttons">
        <button class="btn-cancel" onclick="closeConfirmModal()">Hủy</button>
        <button class="btn-confirm" onclick="executeReset()">Chắc chắn</button>
      </div>
    </div>
  </div>

  <!-- Vùng chứa Toast -->
  <div id="toast" class="toast"></div>

  <div class="header">
    <h1>⚙️ Tùy Chỉnh Đường Đua</h1>
    <div>
      <button class="reset-btn" onclick="resetRace()">🔄 Reset Điểm Số</button>
      <button class="save-btn" onclick="saveSettings()">💾 Lưu Cài Đặt</button>
    </div>
  </div>

  <div style="display: flex; flex-wrap: wrap; gap: 20px; margin-top: 20px;">
    <div class="card" style="flex: 1; min-width: 300px; max-width: 400px;">
      <h3>👤 Cấu Hình Chung</h3>
      <div class="form-group">
        <label>TikTok Username (Người đang Live):</label>
        <input type="text" id="tiktokUsername" value="" placeholder="Ví dụ: father.run52">
      </div>
      <div class="form-group">
        <label>Nhạc Nền BGM (Tên file trong thư mục overlay hoặc Link web):</label>
        <input type="text" id="bgmUrl" value="" placeholder="Ví dụ: nhacnen.mp3 hoặc https://...">
      </div>
      <div class="form-group">
        <label>Nhạc Chiến Thắng (Tên file trong thư mục overlay hoặc Link web):</label>
        <input type="text" id="winSoundUrl" value="" placeholder="Ví dụ: chienthang.mp3 hoặc https://...">
      </div>
      <div class="form-group">
        <label>Nhạc Tặng Quà (Biu biu):</label>
        <input type="text" id="giftSoundUrl" value="" placeholder="Ví dụ: pew.mp3 hoặc https://...">
      </div>
      <div class="form-group">
        <label>Nhạc Ăn Vật Phẩm (Pọc pọc):</label>
        <input type="text" id="eatSoundUrl" value="" placeholder="Ví dụ: pop.mp3 hoặc https://...">
      </div>
      <div class="form-group">
        <label>Kích Thước Phương Tiện (px):</label>
        <input type="number" id="carSize" value="70" min="20" max="200" style="background:#2a2a2a; border:1px solid #444; color:#fff; padding:8px; border-radius:4px; outline:none;">
      </div>
      <div class="form-group">
        <label>Điểm thưởng khi ăn vật phẩm:</label>
        <input type="number" id="itemPoints" value="5" min="1" max="100" style="background:#2a2a2a; border:1px solid #444; color:#fff; padding:8px; border-radius:4px; outline:none;">
      </div>
      <div class="form-group" style="flex-direction: row; align-items: center; gap: 10px;">
        <label style="margin: 0; font-size: 14px;">Bật âm thanh chiến thắng:</label>
        <input type="checkbox" id="enableWinSound" style="width: 18px; height: 18px;">
      </div>
      <div class="form-group" style="flex-direction: row; align-items: center; gap: 10px;">
        <label style="margin: 0; font-size: 14px;">Bật hiệu ứng Neon (xe phát sáng):</label>
        <input type="checkbox" id="enableNeon" style="width: 18px; height: 18px;">
      </div>
    </div>

    <div class="card" style="flex: 1; min-width: 300px; max-width: 400px;">
      <h3>🎁 Hướng Dẫn Tặng Quà</h3>
      <div id="gift-list" style="max-height: 195px; overflow-y: auto; font-size: 14px; background: #2a2a2a; padding: 10px; border-radius: 4px; border: 1px solid #444;">
        <div style="color:#aaa;">Đang tải...</div>
      </div>
    </div>

    <div class="card" style="flex: 2; min-width: 300px;">
      <h3>📝 Live Logs (Lịch sử tương tác)</h3>
      <div id="live-logs" style="height: 420px; overflow-y: auto; font-size: 13px; background: #2a2a2a; padding: 10px; border-radius: 4px; border: 1px solid #444; font-family: Consolas, monospace; line-height: 1.5;">
        <div style="color:#aaa;">Đang kết nối...</div>
      </div>
    </div>
  </div>

  <div class="grid-container" id="settings-form">
    <div style="color:#aaa;">Đang tải dữ liệu cấu hình...</div>
  </div>

  <script>
    let configData = [];
    let appSettings = {};

    async function loadSettings() {
      const resSettings = await fetch('/api/app-settings');
      appSettings = await resSettings.json();
      document.getElementById('tiktokUsername').value = appSettings.tiktokUsername || '';
      document.getElementById('bgmUrl').value = appSettings.bgmUrl || '';
      document.getElementById('winSoundUrl').value = appSettings.winSoundUrl || '';
      document.getElementById('giftSoundUrl').value = appSettings.giftSoundUrl || '';
      document.getElementById('eatSoundUrl').value = appSettings.eatSoundUrl || '';
      document.getElementById('enableWinSound').checked = appSettings.enableWinSound !== false;
      document.getElementById('carSize').value = appSettings.carSize || 70;
      document.getElementById('itemPoints').value = appSettings.itemPoints || 5;
      document.getElementById('enableNeon').checked = appSettings.enableNeon !== false;

      const res = await fetch('/api/config');
      configData = await res.json();

      document.getElementById('gift-list').innerHTML = configData.map(c => `
        <div style="display:flex; align-items:center; justify-content:space-between; padding: 5px 0; border-bottom: 1px dashed #444;">
          <div style="display:flex; align-items:center; gap:5px; width:45%;"><img src="${c.giftImg}" style="height:25px; object-fit:contain;"> <span style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${c.giftName}</span></div>
          <span>➡️</span>
          <div style="display:flex; align-items:center; gap:5px; width:45%; justify-content:flex-end;">${c.name} <img src="${c.flag}" style="height:15px; border-radius:2px;"></div>
        </div>
      `).join('');
      
      const form = document.getElementById('settings-form');
      form.innerHTML = configData.map((c, i) => `
        <div class="card">
          <h3>🏎️ Track ${i + 1} (${c.id})</h3>
          <div class="form-group"><label>Tên Quốc Gia (hoặc Tên Người):</label><input type="text" id="name-${i}" value="${c.name}"></div>
          <div class="form-group"><label>Link Ảnh Cờ (Flag URL):</label><input type="text" id="flag-${i}" value="${c.flag}"></div>
          <div class="form-group"><label>Tên Quà Nhận Diện (Gift Name):</label><input type="text" id="giftName-${i}" value="${c.giftName}"></div>
          <div class="form-group"><label>Link Ảnh Quà (Gift Image URL):</label><input type="text" id="giftImg-${i}" value="${c.giftImg}"></div>
          <div class="form-group"><label>Link Vịt/Xe (Character URL):</label><input type="text" id="carImg-${i}" value="${c.carImg}"></div>
        </div>
      `).join('');
    }

    async function saveSettings() {
      appSettings.tiktokUsername = document.getElementById('tiktokUsername').value;
      appSettings.bgmUrl = document.getElementById('bgmUrl').value;
      appSettings.winSoundUrl = document.getElementById('winSoundUrl').value;
      appSettings.giftSoundUrl = document.getElementById('giftSoundUrl').value;
      appSettings.eatSoundUrl = document.getElementById('eatSoundUrl').value;
      appSettings.enableWinSound = document.getElementById('enableWinSound').checked;
      appSettings.carSize = parseInt(document.getElementById('carSize').value) || 70;
      appSettings.itemPoints = parseInt(document.getElementById('itemPoints').value) || 5;
      appSettings.enableNeon = document.getElementById('enableNeon').checked;
      await fetch('/api/app-settings', { 
        method: 'POST', 
        headers: { 'Content-Type': 'application/json' }, 
        body: JSON.stringify(appSettings) 
      });

      configData.forEach((c, i) => {
        c.name = document.getElementById(`name-${i}`).value;
        c.flag = document.getElementById(`flag-${i}`).value;
        c.giftName = document.getElementById(`giftName-${i}`).value;
        c.giftImg = document.getElementById(`giftImg-${i}`).value;
        c.carImg = document.getElementById(`carImg-${i}`).value;
      });

      await fetch('/api/config', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(configData) });
      showToast('✅ Đã lưu cấu hình! OBS/Trình duyệt stream sẽ tự động tải lại.');
    }

    // Hàm hiển thị Toast có thể gọi lại ở bất cứ đâu
    function showToast(message, duration = 3000) {
      const toast = document.getElementById("toast");
      toast.innerText = message;
      toast.classList.add("show");
      setTimeout(() => {
        toast.classList.remove("show");
      }, duration);
    }

    // Hàm mở Modal Confirm
    function resetRace() {
      document.getElementById('confirmModal').style.display = 'flex';
    }
    // Hàm đóng Modal
    function closeConfirmModal() {
      document.getElementById('confirmModal').style.display = 'none';
    }
    // Hàm gọi API sau khi chắc chắn
    async function executeReset() {
      closeConfirmModal();
      await fetch('/api/reset', { method: 'POST' });
      showToast('✅ Đã reset điểm số cuộc đua!');
    }

    // === LOGIC LIVE LOGS (Sử dụng Socket.io) ===
    const socket = io();

    function addLog(message, color = '#fff') {
      const logContainer = document.getElementById('live-logs');
      if (logContainer.innerHTML.includes('Đang kết nối...')) {
        logContainer.innerHTML = ''; // Xóa chữ chờ khi có dữ liệu
      }
      
      const time = new Date().toLocaleTimeString('vi-VN');
      const logItem = document.createElement('div');
      logItem.style.marginBottom = '6px';
      logItem.style.borderBottom = '1px dashed #444';
      logItem.style.paddingBottom = '4px';
      logItem.innerHTML = `<span style="color:#888">[${time}]</span> <span style="color:${color}">${message}</span>`;
      
      logContainer.appendChild(logItem);
      // Tự động cuộn xuống cuối cùng khi có tin nhắn mới
      logContainer.scrollTop = logContainer.scrollHeight; 
    }

    socket.on('connect', () => addLog('🟢 Đã kết nối với máy chủ bắt sự kiện!', '#00ff00'));
    socket.on('disconnect', () => addLog('🔴 Mất kết nối tới máy chủ!', '#ff4757'));
    
    socket.on('newGift', (data) => addLog(`🎁 <b>${data.nickname}</b> vừa tặng quà cho xe <b>${data.carId}</b> (+${data.score} điểm)`, '#00f3ff'));
    socket.on('raceReset', () => addLog(`🔄 Hệ thống đã làm mới lại điểm số!`, '#ff4757'));

    window.onload = loadSettings;
  </script>
</body>
</html>
